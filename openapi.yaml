openapi: 3.0.3
info:
  title: VedicLMS API
  description: |
    Comprehensive API for VedicLMS - A multilingual Learning Management System for Vedic education.
    
    **Architecture:** Modular backend with 6 domain modules:
    - Identity & Access: User management, authentication, authorization
    - Content Publishing: Tracks, chapters, text segmentation
    - Media Pipeline: Audio files, media segments, segment mappings
    - Batch & Cohort: Batches, enrollments, co-instructors, progress evaluation
    - Learning Delivery: Student-facing learning APIs, progress tracking
    - System Admin: Audit logs, system settings, monitoring
    
    **Multilingual Support:** Telugu (te), Hindi/Devanagari (hi), English/IAST (en)
    
    **Authentication:** Session-based auth with Passport.js (PostgreSQL-backed sessions)
    
    **Authorization:** Role-based access control (student, instructor, content_manager, admin)
  version: 2.0.0
  contact:
    name: VedicLMS Support
    email: support@vedic-lms.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:5000
    description: Development server
  - url: https://your-domain.replit.app
    description: Production server

security:
  - sessionAuth: []

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Users
    description: User management (admin only)
  - name: Tracks
    description: Learning track operations
  - name: Chapters
    description: Chapter content management
  - name: Text Segments
    description: Text segmentation for audio synchronization
  - name: Audio Files
    description: Audio file upload and management
  - name: Media Segments
    description: Audio timestamp segment management
  - name: Segment Mappings
    description: Text-to-audio mapping system
  - name: Batches
    description: Batch and enrollment management
  - name: Progress
    description: Student progress tracking and evaluation
  - name: Learning
    description: Student-facing learning APIs
  - name: System Admin
    description: Audit logs and system settings

paths:
  # =============================================================================
  # AUTHENTICATION & IDENTITY (identity-access module)
  # =============================================================================
  
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register new user
      description: Register a new user account (pending approval unless admin email)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                fullName:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login with email and password
      description: Authenticate user with local strategy (Passport.js)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/google:
    get:
      tags: [Authentication]
      summary: Initiate Google OAuth flow
      description: Redirect to Google OAuth consent screen
      security: []
      responses:
        '302':
          description: Redirect to Google OAuth

  /api/auth/google/callback:
    get:
      tags: [Authentication]
      summary: Google OAuth callback
      description: Handle Google OAuth callback and create session
      security: []
      responses:
        '302':
          description: Redirect to app after authentication

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Logout current user
      description: Destroy session and logout user
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get current user
      description: Retrieve current authenticated user details
      responses:
        '200':
          description: Current user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/users:
    get:
      tags: [Users]
      summary: List all users
      description: Get all users (pending and active) - Admin only
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/users/{userId}:
    get:
      tags: [Users]
      summary: Get user by ID
      description: Retrieve specific user details - Admin only
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/admin/users/{userId}/approve:
    post:
      tags: [Users]
      summary: Approve pending user
      description: Approve user registration and add student role - Admin only
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User approved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/admin/users/{userId}/roles:
    post:
      tags: [Users]
      summary: Assign roles to user
      description: Add roles to user account - Admin only
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items:
                    type: string
                    enum: [student, instructor, content_manager, admin]
      responses:
        '200':
          description: Roles assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/auth/admin/users/{userId}/disable:
    post:
      tags: [Users]
      summary: Disable user account
      description: Set user status to inactive - Admin only
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User disabled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # =============================================================================
  # CONTENT PUBLISHING (content-publishing module)
  # =============================================================================

  /api/tracks:
    get:
      tags: [Tracks]
      summary: List all tracks
      description: Get all published learning tracks (public access)
      security: []
      responses:
        '200':
          description: List of tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'
    
    post:
      tags: [Tracks]
      summary: Create new track
      description: Create a new learning track - Content managers/Admin only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrackRequest'
      responses:
        '201':
          description: Track created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'

  /api/tracks/{id}:
    get:
      tags: [Tracks]
      summary: Get track by ID
      description: Retrieve specific track details
      security: []
      parameters:
        - $ref: '#/components/parameters/TrackId'
      responses:
        '200':
          description: Track details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
    
    put:
      tags: [Tracks]
      summary: Update track
      description: Update track details - Content managers/Admin only
      parameters:
        - $ref: '#/components/parameters/TrackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrackRequest'
      responses:
        '200':
          description: Track updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
    
    delete:
      tags: [Tracks]
      summary: Delete track
      description: Delete track and all chapters - Content managers/Admin only
      parameters:
        - $ref: '#/components/parameters/TrackId'
      responses:
        '200':
          description: Track deleted successfully

  /api/tracks/{id}/move:
    post:
      tags: [Tracks]
      summary: Reorder track
      description: Move track up or down - Content managers/Admin only
      parameters:
        - $ref: '#/components/parameters/TrackId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction:
                  type: string
                  enum: [up, down]
      responses:
        '200':
          description: Track order updated

  /api/chapters:
    get:
      tags: [Chapters]
      summary: List chapters by track
      description: Get all chapters for a track (specify trackId in query)
      security: []
      parameters:
        - name: trackId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chapter'
    
    post:
      tags: [Chapters]
      summary: Create new chapter
      description: Create a new chapter - Content managers/Admin only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChapterRequest'
      responses:
        '201':
          description: Chapter created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'

  /api/chapters/{chapterId}:
    get:
      tags: [Chapters]
      summary: Get chapter details
      description: Retrieve specific chapter
      security: []
      parameters:
        - $ref: '#/components/parameters/ChapterId'
      responses:
        '200':
          description: Chapter details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
    
    patch:
      tags: [Chapters]
      summary: Update chapter
      description: Update chapter content or metadata - Content managers/Admin only
      parameters:
        - $ref: '#/components/parameters/ChapterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChapterRequest'
      responses:
        '200':
          description: Chapter updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
    
    delete:
      tags: [Chapters]
      summary: Delete chapter
      description: Delete chapter (cannot delete if status=published) - Content managers/Admin only
      parameters:
        - $ref: '#/components/parameters/ChapterId'
      responses:
        '200':
          description: Chapter deleted successfully
        '400':
          description: Cannot delete published chapter

  /api/chapters/{chapterId}/status:
    patch:
      tags: [Chapters]
      summary: Publish/unpublish chapter
      description: Toggle chapter status (draft/published) - Content managers/Admin only
      parameters:
        - $ref: '#/components/parameters/ChapterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [draft, published]
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'

  /api/chapters/{chapterId}/move:
    post:
      tags: [Chapters]
      summary: Reorder chapter
      description: Move chapter up or down within track - Content managers/Admin only
      parameters:
        - $ref: '#/components/parameters/ChapterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction:
                  type: string
                  enum: [up, down]
      responses:
        '200':
          description: Chapter order updated

  /api/segments:
    get:
      tags: [Text Segments]
      summary: Get text segments for chapter
      description: Retrieve all segments for a chapter (filter by chapterId and optionally script)
      security: []
      parameters:
        - name: chapterId
          in: query
          required: true
          schema:
            type: integer
        - name: script
          in: query
          schema:
            type: string
            enum: [te, hi, en]
      responses:
        '200':
          description: List of text segments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TextSegment'
    
    post:
      tags: [Text Segments]
      summary: Create text segment
      description: Create new text segment with position boundaries - Content managers/Admin only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTextSegmentRequest'
      responses:
        '201':
          description: Segment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextSegment'

  /api/segments/{segmentId}:
    patch:
      tags: [Text Segments]
      summary: Update text segment
      description: Update segment boundaries - Content managers/Admin only
      parameters:
        - $ref: '#/components/parameters/SegmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTextSegmentRequest'
      responses:
        '200':
          description: Segment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextSegment'
    
    delete:
      tags: [Text Segments]
      summary: Delete text segment
      description: Delete segment and all mappings - Content managers/Admin only
      parameters:
        - $ref: '#/components/parameters/SegmentId'
      responses:
        '200':
          description: Segment deleted successfully

  /api/segments/{chapterId}/reorder:
    patch:
      tags: [Text Segments]
      summary: Reorder segments
      description: Bulk reorder segments within chapter - Content managers/Admin only
      parameters:
        - $ref: '#/components/parameters/ChapterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [segmentIds]
              properties:
                segmentIds:
                  type: array
                  items:
                    type: integer
                  description: Ordered array of segment IDs
      responses:
        '200':
          description: Segments reordered successfully

  # =============================================================================
  # MEDIA PIPELINE (media-pipeline module)
  # =============================================================================

  /api/audio-files:
    get:
      tags: [Audio Files]
      summary: List audio files for chapter
      description: Get all audio files for a chapter (filter by chapterId)
      security: []
      parameters:
        - name: chapterId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of audio files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AudioFile'
    
    post:
      tags: [Audio Files]
      summary: Upload audio file
      description: Upload audio file with automatic metadata extraction - Content managers/Admin only
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, chapterId]
              properties:
                audio:
                  type: string
                  format: binary
                  description: Audio file (max 50MB)
                chapterId:
                  type: integer
                reciter:
                  type: string
                displayName:
                  type: string
      responses:
        '201':
          description: Audio file uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioFile'

  /api/audio-files/{audioFileId}:
    patch:
      tags: [Audio Files]
      summary: Update audio metadata
      description: Update audio file metadata - Content managers/Admin only
      parameters:
        - $ref: '#/components/parameters/AudioFileId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                reciter:
                  type: string
      responses:
        '200':
          description: Audio file updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioFile'
    
    delete:
      tags: [Audio Files]
      summary: Delete audio file
      description: Delete audio file and all mappings - Content managers/Admin only
      parameters:
        - $ref: '#/components/parameters/AudioFileId'
      responses:
        '200':
          description: Audio file deleted successfully

  /api/media-segments:
    get:
      tags: [Media Segments]
      summary: List media segments for audio
      description: Get all media segments for an audio file
      security: []
      parameters:
        - name: audioFileId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of media segments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MediaSegment'
    
    post:
      tags: [Media Segments]
      summary: Create media segment
      description: Create single media segment - Content managers/Admin only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaSegmentRequest'
      responses:
        '201':
          description: Media segment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSegment'

  /api/media-segments/bulk:
    post:
      tags: [Media Segments]
      summary: Create media segments in bulk
      description: Create multiple media segments at once - Content managers/Admin only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audioFileId, segments]
              properties:
                audioFileId:
                  type: integer
                segments:
                  type: array
                  items:
                    type: object
                    required: [startTime, endTime]
                    properties:
                      startTime:
                        type: number
                      endTime:
                        type: number
      responses:
        '201':
          description: Media segments created successfully

  /api/media-segments/{mediaSegmentId}:
    patch:
      tags: [Media Segments]
      summary: Update media segment
      description: Update media segment timestamps - Content managers/Admin only
      parameters:
        - name: mediaSegmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startTime:
                  type: number
                endTime:
                  type: number
      responses:
        '200':
          description: Media segment updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaSegment'
    
    delete:
      tags: [Media Segments]
      summary: Delete media segment
      description: Delete media segment - Content managers/Admin only
      parameters:
        - name: mediaSegmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Media segment deleted successfully

  /api/mappings:
    get:
      tags: [Segment Mappings]
      summary: List segment mappings
      description: Get mappings by chapter or audio file
      security: []
      parameters:
        - name: chapterId
          in: query
          schema:
            type: integer
        - name: audioFileId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of segment mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SegmentMapping'
    
    post:
      tags: [Segment Mappings]
      summary: Create segment mapping
      description: Map text segment to audio timestamps - Content managers/Admin only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSegmentMappingRequest'
      responses:
        '201':
          description: Mapping created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentMapping'

  /api/mappings/count:
    get:
      tags: [Segment Mappings]
      summary: Count mappings for audio file
      description: Get mapping count for an audio file
      security: []
      parameters:
        - name: audioFileId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Mapping count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  /api/mappings/{textSegmentId}/{audioFileId}:
    delete:
      tags: [Segment Mappings]
      summary: Delete mapping
      description: Delete mapping by text segment and audio file - Content managers/Admin only
      parameters:
        - name: textSegmentId
          in: path
          required: true
          schema:
            type: integer
        - name: audioFileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Mapping deleted successfully

  # =============================================================================
  # BATCH & COHORT (batch-cohort module)
  # =============================================================================

  /api/batches:
    get:
      tags: [Batches]
      summary: List all batches
      description: Get all batches (instructors see assigned batches, admins see all)
      responses:
        '200':
          description: List of batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Batch'
    
    post:
      tags: [Batches]
      summary: Create new batch
      description: Create a new batch - Admin only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchRequest'
      responses:
        '201':
          description: Batch created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'

  /api/batches/{id}:
    get:
      tags: [Batches]
      summary: Get batch details
      description: Get batch by ID - Instructors/Admin only
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Batch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
    
    patch:
      tags: [Batches]
      summary: Update batch
      description: Update batch details - Instructors/Admin only
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                startDate:
                  type: string
                  format: date
                endDate:
                  type: string
                  format: date
                trackId:
                  type: integer
      responses:
        '200':
          description: Batch updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'

  /api/batches/{id}/enrollments:
    get:
      tags: [Batches]
      summary: List enrollments in batch
      description: Get all students enrolled in batch - Instructors/Admin only
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: List of enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Enrollment'
    
    post:
      tags: [Batches]
      summary: Enroll student in batch
      description: Add student to batch - Admin only
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [studentId]
              properties:
                studentId:
                  type: integer
      responses:
        '201':
          description: Student enrolled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'

  /api/enrollments/{enrollmentId}/drop:
    patch:
      tags: [Batches]
      summary: Drop student enrollment
      description: Mark enrollment as dropped with reason - Instructors/Admin only
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dropReason]
              properties:
                dropReason:
                  type: string
      responses:
        '200':
          description: Enrollment dropped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'

  /api/batches/{id}/co-instructors:
    get:
      tags: [Batches]
      summary: List co-instructors
      description: Get all co-instructors for batch - Instructors/Admin only
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: List of co-instructors
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    userId:
                      type: integer
                    fullName:
                      type: string
                    assignedAt:
                      type: string
                      format: date-time
    
    post:
      tags: [Batches]
      summary: Assign co-instructor
      description: Add co-instructor to batch - Admin only
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instructorId]
              properties:
                instructorId:
                  type: integer
      responses:
        '201':
          description: Co-instructor assigned successfully

  /api/batches/{batchId}/co-instructors/{instructorId}:
    delete:
      tags: [Batches]
      summary: Remove co-instructor
      description: Remove co-instructor from batch - Admin only
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: integer
        - name: instructorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Co-instructor removed successfully

  /api/batches/{batchId}/progress:
    get:
      tags: [Progress]
      summary: Get batch progress grid
      description: Excel-like grid of all student progress in batch - Instructors/Admin only
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Student progress data
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    studentId:
                      type: integer
                    studentName:
                      type: string
                    chapterProgress:
                      type: object
                      additionalProperties:
                        type: object
                        properties:
                          proficiencyLevel:
                            type: integer
                            minimum: 0
                            maximum: 4
                          lastEvaluated:
                            type: string
                            format: date-time

  /api/batches/{batchId}/students/{studentId}/evaluate:
    post:
      tags: [Progress]
      summary: Evaluate student
      description: Record student proficiency evaluation for chapter - Instructors only
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: integer
        - name: studentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chapterId, proficiencyLevel]
              properties:
                chapterId:
                  type: integer
                proficiencyLevel:
                  type: integer
                  minimum: 0
                  maximum: 4
                  description: 0=Not Started, 1=Beginner, 2=Intermediate, 3=Advanced, 4=Mastered
                notes:
                  type: string
      responses:
        '201':
          description: Evaluation recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProgress'

  # =============================================================================
  # LEARNING DELIVERY (learning-delivery module)
  # =============================================================================

  /api/learning/progress:
    get:
      tags: [Learning]
      summary: Get student progress
      description: Students see own progress, instructors/admins can filter by studentId/trackId/chapterId/batchId
      parameters:
        - name: studentId
          in: query
          schema:
            type: integer
        - name: trackId
          in: query
          schema:
            type: integer
        - name: chapterId
          in: query
          schema:
            type: integer
        - name: batchId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Student progress data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentProgress'

  /api/learning/chapters:
    get:
      tags: [Learning]
      summary: Get available chapters
      description: Get chapters student has access to (based on batch enrollments) - Students only
      responses:
        '200':
          description: List of accessible chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chapter'

  /api/learning/chapters/{chapterId}/access:
    post:
      tags: [Learning]
      summary: Track chapter access
      description: Update lastAccessed timestamp for chapter - Students only
      parameters:
        - $ref: '#/components/parameters/ChapterId'
      responses:
        '200':
          description: Access tracked successfully

  /api/learning/tracks:
    get:
      tags: [Learning]
      summary: List tracks for learning
      description: Facade API for student track browsing
      responses:
        '200':
          description: List of tracks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'

  /api/learning/tracks/{trackId}/chapters:
    get:
      tags: [Learning]
      summary: List chapters in track
      description: Facade API for student chapter browsing
      parameters:
        - $ref: '#/components/parameters/TrackId'
      responses:
        '200':
          description: List of chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Chapter'

  /api/learning/chapters/{chapterId}/bundle:
    get:
      tags: [Learning]
      summary: Get unified chapter bundle
      description: Retrieve chapter with opt-in includes (segments, audio, mappings, progress) and script filter
      parameters:
        - $ref: '#/components/parameters/ChapterId'
        - name: include
          in: query
          schema:
            type: string
            description: Comma-separated list (chapter,segments,audio,mappings,progress)
        - name: script
          in: query
          schema:
            type: string
            enum: [te, hi, en]
      responses:
        '200':
          description: Chapter bundle with requested data
          content:
            application/json:
              schema:
                type: object
                properties:
                  chapter:
                    $ref: '#/components/schemas/Chapter'
                  segments:
                    type: array
                    items:
                      $ref: '#/components/schemas/TextSegment'
                  audio:
                    type: array
                    items:
                      $ref: '#/components/schemas/AudioFile'
                  mappings:
                    type: array
                    items:
                      $ref: '#/components/schemas/SegmentMapping'
                  progress:
                    $ref: '#/components/schemas/StudentProgress'

  # =============================================================================
  # SYSTEM ADMIN (system-admin module)
  # =============================================================================

  /api/admin/audit-logs:
    get:
      tags: [System Admin]
      summary: List audit logs
      description: Get audit logs with pagination and filters - Admin only
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
        - name: action
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: perPage
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of audit logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /api/admin/settings:
    get:
      tags: [System Admin]
      summary: Get all system settings
      description: Retrieve all system configuration settings - Admin only
      responses:
        '200':
          description: System settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemSetting'

  /api/admin/settings/{key}:
    get:
      tags: [System Admin]
      summary: Get system setting
      description: Retrieve single setting by key - Admin only
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: System setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSetting'
    
    put:
      tags: [System Admin]
      summary: Update system setting
      description: Update setting value - Admin only
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: string
      responses:
        '200':
          description: Setting updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSetting'

# =============================================================================
# COMPONENTS
# =============================================================================

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: PostgreSQL-backed session cookie (Passport.js)

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        fullName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [student, instructor, content_manager, admin]
        status:
          type: string
          enum: [pending_approval, active, inactive]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Track:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        order:
          type: integer
        status:
          type: string
          enum: [draft, published]
        estimatedHours:
          type: integer
        createdBy:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTrackRequest:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
        description:
          type: string
        estimatedHours:
          type: integer

    UpdateTrackRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, published]
        estimatedHours:
          type: integer

    Chapter:
      type: object
      properties:
        id:
          type: integer
        trackId:
          type: integer
        title:
          type: string
        order:
          type: integer
        status:
          type: string
          enum: [draft, published]
        content:
          $ref: '#/components/schemas/MultilingualContent'
        publishedAt:
          type: string
          format: date-time
        lastEditedBy:
          type: integer
        createdBy:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MultilingualContent:
      type: object
      description: Content in three scripts (Telugu, Hindi/Devanagari, English/IAST)
      properties:
        te:
          type: string
          description: Telugu content
        hi:
          type: string
          description: Hindi/Devanagari content
        en:
          type: string
          description: English/IAST content

    CreateChapterRequest:
      type: object
      required: [trackId, title]
      properties:
        trackId:
          type: integer
        title:
          type: string
        content:
          $ref: '#/components/schemas/MultilingualContent'

    UpdateChapterRequest:
      type: object
      properties:
        title:
          type: string
        content:
          $ref: '#/components/schemas/MultilingualContent'
        status:
          type: string
          enum: [draft, published]

    TextSegment:
      type: object
      properties:
        id:
          type: integer
        chapterId:
          type: integer
        script:
          type: string
          enum: [te, hi, en]
          description: Script-specific segmentation
        startPosition:
          type: integer
          description: Character offset start
        endPosition:
          type: integer
          description: Character offset end
        order:
          type: integer
        createdBy:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateTextSegmentRequest:
      type: object
      required: [chapterId, script, startPosition, endPosition]
      properties:
        chapterId:
          type: integer
        script:
          type: string
          enum: [te, hi, en]
        startPosition:
          type: integer
        endPosition:
          type: integer

    UpdateTextSegmentRequest:
      type: object
      properties:
        startPosition:
          type: integer
        endPosition:
          type: integer

    AudioFile:
      type: object
      properties:
        id:
          type: integer
        chapterId:
          type: integer
        filename:
          type: string
        displayName:
          type: string
        reciter:
          type: string
        duration:
          type: number
          description: Duration in seconds
        fileSize:
          type: integer
          description: File size in bytes
        mimeType:
          type: string
        uploadedBy:
          type: integer
        createdAt:
          type: string
          format: date-time

    MediaSegment:
      type: object
      properties:
        id:
          type: integer
        audioFileId:
          type: integer
        startTime:
          type: number
          description: Start timestamp in seconds
        endTime:
          type: number
          description: End timestamp in seconds
        createdAt:
          type: string
          format: date-time

    CreateMediaSegmentRequest:
      type: object
      required: [audioFileId, startTime, endTime]
      properties:
        audioFileId:
          type: integer
        startTime:
          type: number
        endTime:
          type: number

    SegmentMapping:
      type: object
      properties:
        id:
          type: integer
        textSegmentId:
          type: integer
        audioFileId:
          type: integer
        startTime:
          type: number
        endTime:
          type: number
        createdBy:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateSegmentMappingRequest:
      type: object
      required: [textSegmentId, audioFileId, startTime, endTime]
      properties:
        textSegmentId:
          type: integer
        audioFileId:
          type: integer
        startTime:
          type: number
        endTime:
          type: number

    Batch:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        trackId:
          type: integer
        leadInstructorId:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time

    CreateBatchRequest:
      type: object
      required: [name, trackId, leadInstructorId, startDate]
      properties:
        name:
          type: string
        trackId:
          type: integer
        leadInstructorId:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    Enrollment:
      type: object
      properties:
        id:
          type: integer
        batchId:
          type: integer
        studentId:
          type: integer
        status:
          type: string
          enum: [active, dropped]
        enrolledAt:
          type: string
          format: date-time
        droppedAt:
          type: string
          format: date-time
        dropReason:
          type: string

    StudentProgress:
      type: object
      properties:
        id:
          type: integer
        studentId:
          type: integer
        chapterId:
          type: integer
        batchId:
          type: integer
        proficiencyLevel:
          type: integer
          minimum: 0
          maximum: 4
          description: 0=Not Started, 1=Beginner, 2=Intermediate, 3=Advanced, 4=Mastered
        lastAccessed:
          type: string
          format: date-time
        evaluatedBy:
          type: integer
        evaluatedAt:
          type: string
          format: date-time
        notes:
          type: string

    AuditLog:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: integer
        metadata:
          type: object
        timestamp:
          type: string
          format: date-time

    SystemSetting:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        updatedAt:
          type: string
          format: date-time

    Pagination:
      type: object
      properties:
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer

    TrackId:
      name: id
      in: path
      required: true
      schema:
        type: integer

    ChapterId:
      name: chapterId
      in: path
      required: true
      schema:
        type: integer

    AudioFileId:
      name: audioFileId
      in: path
      required: true
      schema:
        type: integer

    SegmentId:
      name: segmentId
      in: path
      required: true
      schema:
        type: integer

    BatchId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    BadRequest:
      description: Bad request - Invalid parameters or request body
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    Unauthorized:
      description: Unauthorized - Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
