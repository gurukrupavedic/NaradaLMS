name: narada

services:
  narada-db:
    container_name: narada-db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: narada
      POSTGRES_PASSWORD: narada
      POSTGRES_DB: narada
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narada -d narada"]
      interval: 5s
      timeout: 5s
      retries: 10

  narada-api:
    container_name: narada-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "3000:3000"
    depends_on:
      narada-db:
        condition: service_healthy
    restart: unless-stopped

  # The pre-rewrite API, kept buildable as a fallback while apps/api (above) is still unreviewed —
  # opt-in only, the same way apps/api itself used to be the opt-in one before the rename.
  narada-api-legacy:
    profiles: ["legacy"]
    container_name: narada-api-legacy
    build:
      context: .
      dockerfile: apps/api-legacy/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      API_BASE_URL: ${API_LEGACY_BASE_URL:-http://localhost:3001/v1}
    ports:
      - "3001:3000"
    depends_on:
      narada-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
