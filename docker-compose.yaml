name: narada

services:
  narada-db:
    container_name: narada-db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: narada
      POSTGRES_PASSWORD: narada
      POSTGRES_DB: narada
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narada -d narada"]
      interval: 5s
      timeout: 5s
      retries: 10

  narada-api:
    container_name: narada-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: .env
        required: false
    ports:
      - "3000:3000"
    depends_on:
      narada-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
