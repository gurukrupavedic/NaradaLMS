<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White Background Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: white !important;
      background-color: white !important;
    }
  </style>
</head>
<body class="bg-white">
  <div class="max-w-4xl mx-auto p-8">
    <h1 class="text-4xl font-bold text-center mb-8">White Background Test</h1>
    <div class="bg-blue-100 p-6 rounded-lg mb-6">
      <h2 class="text-2xl font-semibold mb-4">Test Section</h2>
      <p class="text-gray-700">This should have a white background.</p>
    </div>
    <div class="grid grid-cols-3 gap-4">
      <div class="bg-red-500 text-white p-4 rounded">Red Card</div>
      <div class="bg-green-500 text-white p-4 rounded">Green Card</div>
      <div class="bg-blue-500 text-white p-4 rounded">Blue Card</div>
    </div>
  </div>
</body>
</html>
