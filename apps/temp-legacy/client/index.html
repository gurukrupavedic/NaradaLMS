<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Narada LMS</title>

  <!-- Unified Theme-Aware Favicon -->
  <!-- Dynamic Favicons (JS-Based for Universal Support) -->
  <link rel="icon" id="dynamic-favicon" href="/favicon-symbol-dark.svg" type="image/svg+xml" />
  <script>
    (function () {
      const link = document.getElementById('dynamic-favicon');
      const darkIcon = '/favicon-symbol-dark.svg'; // White logo for Dark Mode
      const lightIcon = '/favicon-symbol-light.svg'; // Dark logo for Light Mode

      const updateFavicon = (e) => {
        link.href = e.matches ? darkIcon : lightIcon;
      };

      const matcher = window.matchMedia('(prefers-color-scheme: dark)');
      updateFavicon(matcher); // Set initial
      matcher.addEventListener('change', updateFavicon); // Listen for updates
    })();
  </script>

  <!-- Brand Meta -->
  <meta name="theme-color" content="#330f42" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#260b31" media="(prefers-color-scheme: dark)" />
  <meta name="description"
    content="A comprehensive Vedic learning platform blending ancient wisdom with modern technology." />

  <!-- OpenGraph / Social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Narada LMS" />
  <meta property="og:description"
    content="A comprehensive Vedic learning platform blending ancient wisdom with modern technology." />
  <meta property="og:image" content="/icon-contained-dark.png" />
  <meta name="twitter:card" content="summary_large_image" />

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
