name: Deploy API to Railway (production)

# Manual only — this ships a production build of the API. Deliberately no
# push/PR trigger so a merge to main never auto-deploys.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a production deploy'
        required: true

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Same migrate-before-deploy ordering and reasoning as deploy-api-staging.yml's identical
      # step: additive schema changes are safe to apply ahead of the new code that uses them, and
      # `railway run` inherits this environment's own DATABASE_URL rather than duplicating secrets.
      - name: Apply pending database migrations
        run: railway run --service "$RAILWAY_SERVICE" --environment production pnpm run ci:migrate
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE_ID }}

      - name: Deploy API to Railway
        run: railway up --service "$RAILWAY_SERVICE" --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE_ID }}
