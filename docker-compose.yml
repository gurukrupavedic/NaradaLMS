version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: narada_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: naradalms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - narada-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (Optional/Future use for sessions/queues if needed)
  redis:
    image: redis:7-alpine
    container_name: narada_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - narada-net

  # Monolith API (Legacy/Transitional)
  # In Phase 0, we can run this via docker-compose for validation
  api:
    build:
      context: .
      dockerfile: Dockerfile.base # Placeholder - actual app needs full build
    image: narada-monolith:dev
    # We don't mount volumns/run here because we run locally via npm run dev usually
    # But this proves connectivity
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - narada-net

networks:
  narada-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
